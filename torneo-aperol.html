  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;hub-torneo-preview&#x27;);
      const list=root.querySelector(&#x27;#hp-event-list&#x27;);
      const detail=root.querySelector(&#x27;#hp-event-detail&#x27;);
      const save=root.querySelector(&#x27;#hp-save-state&#x27;);
      root.querySelector(&#x27;#hp-open-event&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{list.classList.add(&#x27;hp-hidden&#x27;);detail.classList.remove(&#x27;hp-hidden&#x27;)});
      root.querySelector(&#x27;#hp-back&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{window.location.href=&#x27;index.html&#x27;});
      root.querySelectorAll(&#x27;[data-return-view]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;{window.location.href=`index.html?view=${button.dataset.returnView}`}));
      const resultInputs=[...root.querySelectorAll(&#x27;.hp-score input&#x27;)];
      const storageKey=&#x27;hub-point-torneo-aperol-resultados&#x27;;
      const savedResults=JSON.parse(localStorage.getItem(storageKey)||&#x27;[]&#x27;);
      resultInputs.forEach((input,index)=&gt;{if(savedResults[index]!==undefined)input.value=savedResults[index]});
      const teams={
        a1:{name:&#x27;Gonzalo Arroyo / Camila Salvay&#x27;,short:&#x27;Gonzalo / Camila&#x27;,group:&#x27;A&#x27;},
        a2:{name:&#x27;Franco Bonnahón / Darío Escobar&#x27;,short:&#x27;Franco / Darío&#x27;,group:&#x27;A&#x27;},
        a3:{name:&#x27;Sebastián Aguirre Saravia / Tiago Arambarri&#x27;,short:&#x27;Sebastián A. / Tiago&#x27;,group:&#x27;A&#x27;},
        a4:{name:&#x27;Pedro Delfino / Agustín Ferrando&#x27;,short:&#x27;Pedro D. / Agustín&#x27;,group:&#x27;A&#x27;},
        b1:{name:&#x27;Facundo Bengolea / Alejandra Ceballos&#x27;,short:&#x27;Facundo / Alejandra&#x27;,group:&#x27;B&#x27;},
        b2:{name:&#x27;Pablo Meira / Ximena Calveyra&#x27;,short:&#x27;Pablo / Ximena&#x27;,group:&#x27;B&#x27;},
        b3:{name:&#x27;Sebastián Lizana / Bruno Mariscotti&#x27;,short:&#x27;Sebastián L. / Bruno&#x27;,group:&#x27;B&#x27;},
        b4:{name:&#x27;Raúl Belligotti / Santiago Ferrer&#x27;,short:&#x27;Raúl / Santiago&#x27;,group:&#x27;B&#x27;},
        c1:{name:&#x27;Pedro Conte Grand / Germán Toriani&#x27;,short:&#x27;Pedro C. / Germán&#x27;,group:&#x27;C&#x27;},
        c2:{name:&#x27;Rodrigo Berdullas / Lucas Amor&#x27;,short:&#x27;Rodrigo / Lucas&#x27;,group:&#x27;C&#x27;},
        c3:{name:&#x27;Christian Der / Andrés Fernández Dávila&#x27;,short:&#x27;Christian / Andrés&#x27;,group:&#x27;C&#x27;}
      };
      const matchPlan=[
        [&#x27;a1&#x27;,&#x27;a2&#x27;],[&#x27;a3&#x27;,&#x27;a4&#x27;],[&#x27;b1&#x27;,&#x27;b2&#x27;],
        [&#x27;a1&#x27;,&#x27;a3&#x27;],[&#x27;a2&#x27;,&#x27;a4&#x27;],[&#x27;b3&#x27;,&#x27;b4&#x27;],
        [&#x27;a1&#x27;,&#x27;a4&#x27;],[&#x27;a2&#x27;,&#x27;a3&#x27;],[&#x27;c1&#x27;,&#x27;c2&#x27;],
        [&#x27;b1&#x27;,&#x27;b3&#x27;],[&#x27;b2&#x27;,&#x27;b4&#x27;],[&#x27;c1&#x27;,&#x27;c3&#x27;],
        [&#x27;b1&#x27;,&#x27;b4&#x27;],[&#x27;b2&#x27;,&#x27;b3&#x27;],[&#x27;c2&#x27;,&#x27;c3&#x27;]
      ];
      const groupCards=[...root.querySelectorAll(&#x27;.hp-match&#x27;)];
      const standingHost=root.querySelector(&#x27;#hp-standings&#x27;);
      const semifinalTeams=[null,null];
      const scorePair=container=&gt;[...container.querySelectorAll(&#x27;.hp-score input&#x27;)].map(x=&gt;x.value===&#x27;&#x27;?null:Number(x.value));
      const completeScore=score=&gt;score[0]!==null&amp;&amp;score[1]!==null&amp;&amp;Number.isFinite(score[0])&amp;&amp;Number.isFinite(score[1]);
      const groupComparator=(x,y)=&gt;y.pg-x.pg||y.dif-x.dif||y.gf-x.gf||x.name.localeCompare(y.name,&#x27;es&#x27;);
      const normalizedComparator=(x,y)=&gt;(y.pg/y.pj)-(x.pg/x.pj)||(y.dif/y.pj)-(x.dif/x.pj)||(y.gf/y.pj)-(x.gf/x.pj)||x.name.localeCompare(y.name,&#x27;es&#x27;);
      function calculateStandings(){
        const stats={};
        Object.entries(teams).forEach(([id,t])=&gt;stats[id]={id,...t,pj:0,pg:0,gf:0,gc:0,dif:0});
        groupCards.forEach((card,index)=&gt;{
          const score=scorePair(card);
          if(!completeScore(score))return;
          const [homeId,awayId]=matchPlan[index];
          const home=stats[homeId],away=stats[awayId];
          home.pj++;away.pj++;home.gf+=score[0];home.gc+=score[1];away.gf+=score[1];away.gc+=score[0];
          if(score[0]&gt;score[1])home.pg++;else if(score[1]&gt;score[0])away.pg++;
        });
        Object.values(stats).forEach(s=&gt;s.dif=s.gf-s.gc);
        return [&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;].reduce((groups,group)=&gt;{groups[group]=Object.values(stats).filter(s=&gt;s.group===group).sort(groupComparator);return groups},{});
      }
      function renderStandings(groups,allGroupsComplete){
        standingHost.innerHTML=[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;].map(group=&gt;`&lt;div class=&quot;hp-standing-card&quot;&gt;&lt;h4&gt;Grupo ${group}&lt;/h4&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Pareja&lt;/th&gt;&lt;th&gt;PJ&lt;/th&gt;&lt;th&gt;PG&lt;/th&gt;&lt;th&gt;Dif&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${groups[group].map((s,i)=&gt;`&lt;tr class=&quot;${allGroupsComplete&amp;&amp;i===0?&#x27;hp-qualified&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${i+1}&lt;/td&gt;&lt;td&gt;${s.short}&lt;/td&gt;&lt;td&gt;${s.pj}&lt;/td&gt;&lt;td&gt;${s.pg}&lt;/td&gt;&lt;td&gt;${s.dif&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${s.dif}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }
      function knockoutWinner(row,teamPair){
        if(!teamPair[0]||!teamPair[1])return null;
        const score=scorePair(row);
        if(!completeScore(score)||score[0]===score[1])return null;
        return score[0]&gt;score[1]?teamPair[0]:teamPair[1];
      }
      function recalculateTournament(){
        const groups=calculateStandings();
        const allGroupsComplete=groupCards.every(card=&gt;completeScore(scorePair(card)));
        renderStandings(groups,allGroupsComplete);
        const sf1Text=root.querySelector(&#x27;#hp-sf1-teams&#x27;);
        const sf2Text=root.querySelector(&#x27;#hp-sf2-teams&#x27;);
        const finalText=root.querySelector(&#x27;#hp-final-teams&#x27;);
        semifinalTeams[0]=null;semifinalTeams[1]=null;
        if(allGroupsComplete){
          const winners=[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;].map(g=&gt;groups[g][0]).sort(normalizedComparator);
          const bestSecond=[&#x27;A&#x27;,&#x27;B&#x27;,&#x27;C&#x27;].map(g=&gt;groups[g][1]).sort(normalizedComparator)[0];
          semifinalTeams[0]=[winners[0].id,bestSecond.id];
          semifinalTeams[1]=[winners[1].id,winners[2].id];
          sf1Text.textContent=`${teams[semifinalTeams[0][0]].name} vs. ${teams[semifinalTeams[0][1]].name}`;
          sf2Text.textContent=`${teams[semifinalTeams[1][0]].name} vs. ${teams[semifinalTeams[1][1]].name}`;
        }else{
          const completed=groupCards.filter(card=&gt;completeScore(scorePair(card))).length;
          sf1Text.textContent=`Pendiente: ${completed} de ${groupCards.length} resultados cargados`;
          sf2Text.textContent=&#x27;Se completa al finalizar los grupos&#x27;;
        }
        const sf1Winner=knockoutWinner(root.querySelector(&#x27;#hp-sf1&#x27;),semifinalTeams[0]||[]);
        const sf2Winner=knockoutWinner(root.querySelector(&#x27;#hp-sf2&#x27;),semifinalTeams[1]||[]);
        const finalTeams=sf1Winner&amp;&amp;sf2Winner?[sf1Winner,sf2Winner]:[];
        finalText.textContent=finalTeams.length?`${teams[finalTeams[0]].name} vs. ${teams[finalTeams[1]].name}`:&#x27;Se completa al finalizar las semifinales&#x27;;
        const finalWinner=knockoutWinner(root.querySelector(&#x27;#hp-final&#x27;),finalTeams);
        root.querySelector(&#x27;#hp-champion&#x27;).textContent=finalWinner?`Campeón: ${teams[finalWinner].name}`:&#x27;Campeón: pendiente&#x27;;
      }
      function refreshResultState(input){
        const match=input.closest(&#x27;.hp-match&#x27;)||input.closest(&#x27;tr&#x27;);
        if(!match)return;
        const values=[...match.querySelectorAll(&#x27;.hp-score input&#x27;)].map(x=&gt;x.value);
        const status=match.querySelector(&#x27;.hp-match-status&#x27;);
        if(status)status.textContent=values.every(v=&gt;v!==&#x27;&#x27;)?&#x27;Finalizado&#x27;:&#x27;Pendiente&#x27;;
      }
      resultInputs.forEach((input,index)=&gt;{
        refreshResultState(input);
        input.addEventListener(&#x27;input&#x27;,()=&gt;{
          const values=resultInputs.map(x=&gt;x.value);
          localStorage.setItem(storageKey,JSON.stringify(values));
          refreshResultState(input);
          recalculateTournament();
          save.textContent=&#x27;Resultado guardado automáticamente&#x27;;
          window.setTimeout(()=&gt;save.textContent=&#x27;&#x27;,1600);
        });
      });
      recalculateTournament();
    })();
  &lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
